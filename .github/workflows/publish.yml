name: hmsh-autopost
# 자동 발행 — wht-autopost publish.yml 미러.
# 기본: 매일 20:47 KST(11:47 UTC). 47분 = 정각 회피(스케줄러 혼잡 지연 완화, 월핫템 검증 세팅).
# 2026-08-27~29: CJ 런칭 푸시 — 인서트 숏폼 하루 2~4건 발행용 원타임 크론 추가.
# 2026-09-03: 스파밀 로즈모노 피드 9칸 — 9/4~9/6 하루 3건(12:00·18:00·20:47 KST). 9/3은 기본 크론 제외.
# 2026-08-23 한정: 스파밀 모델컷 20:00·22:00 KST 원타임 발행 (18:10은 수동 트리거로 발행).
#   같은 날 20:47 기본 크론이 22:00분을 먼저 집어가지 않도록 8/23은 기본 크론에서 제외.
# 비밀: GOOGLE_CREDENTIALS 1개만 GitHub Secret. 운영토큰은 시트 _config 탭. publish_enabled=true 여야 실발행.
on:
  schedule:
    - cron: '0 11 23 8 *'        # 2026-08-23 20:00 KST (원타임)
    - cron: '0 13 23 8 *'        # 2026-08-23 22:00 KST (원타임)
    - cron: '0 3 28 8 *'         # 2026-08-28 12:00 KST (CJ런칭 푸시)
    - cron: '0 9 28 8 *'         # 2026-08-28 18:00 KST (CJ런칭 푸시)
    - cron: '0 1 29 8 *'         # 2026-08-29 10:00 KST (방송일)
    - cron: '0 4 29 8 *'         # 2026-08-29 13:00 KST (방송일)
    - cron: '0 7 29 8 *'         # 2026-08-29 16:00 KST (방송 직전)
    - cron: '0 3 4-6 9 *'        # 2026-09-04~06 12:00 KST (스파밀 로즈모노 9칸 — 하루 3건)
    - cron: '0 9 4-6 9 *'        # 2026-09-04~06 18:00 KST (스파밀 로즈모노 9칸 — 하루 3건)
    - cron: '47 11 24-31 8 *'    # 8/24~ 매일 20:47 KST
    - cron: '47 11 1-2,4-30 9 *' # 9월 매일 20:47 KST (9/3 제외 — 로즈모노는 9/4 12:00부터 시작)
    - cron: '47 11 * 1-7,10-12 *'# 9월·8월 외 매일 20:47 KST
  workflow_dispatch: {}

concurrency:
  group: hmsh-autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 구글 서비스계정 키 생성(임시)
        run: printf '%s' "$GOOGLE_CREDENTIALS" > google-credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: 발행 실행
        run: node cloud-autopost.js
