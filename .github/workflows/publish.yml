name: hmsh-autopost
# 매일 20:47 KST(11:47 UTC) 자동 발행 — wht-autopost publish.yml 미러 (주기만 매일).
# 정각 0분 회피(47분): GitHub Actions 스케줄러 혼잡 지연 완화 (월핫템에서 검증된 세팅).
# 비밀: GOOGLE_CREDENTIALS(서비스계정 JSON) 1개만 GitHub Secret. 운영토큰은 시트 _config 탭.
# 시트 _config publish_enabled=true 여야 실발행 (안전핀).
on:
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: hmsh-autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: 구글 서비스계정 키 생성(임시)
        run: printf '%s' "$GOOGLE_CREDENTIALS" > google-credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: 발행 실행
        run: node cloud-autopost.js
